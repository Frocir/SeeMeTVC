services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seeme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seeme}
      POSTGRES_DB: ${POSTGRES_DB:-seemetvc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seeme} -d ${POSTGRES_DB:-seemetvc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-seeme}:${POSTGRES_PASSWORD:-seeme}@db:5432/${POSTGRES_DB:-seemetvc}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin123456}
      UPLOAD_DIR: /app/data/uploads
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8000}
      LOCAL_PROXY_HOST: ${LOCAL_PROXY_HOST:-127.0.0.1}
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
