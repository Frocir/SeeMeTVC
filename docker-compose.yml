services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seeme
      POSTGRES_PASSWORD: seeme
      POSTGRES_DB: seemetvc
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seeme -d seemetvc"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://seeme:seeme@db:5432/seemetvc
      JWT_SECRET: change-me-in-production
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: admin123456
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
