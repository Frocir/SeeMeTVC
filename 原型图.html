<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SeeMeTVC · 原型图</title>
<style>
:root {
  --bg: #faf7f8; --bg-soft: #f1e9ed; --surface: #ffffff;
  --ink: #241e22; --ink-soft: #5c5158; --muted: #9a8e95;
  --line: #eadfe4; --line-strong: #dccfd6;
  --accent: #d4578a; --accent-soft: rgba(212, 87, 138, 0.12); --accent-ink: #fff7fa;
  --cta: #241e22; --cta-ink: #fff9fb;
  --ok: #2f9d6a; --danger: #e25563; --warn: #d98b3c; --rose: #f3c0d1; --pearl: #fff9fb;
  --rail: #241e22; --rail-muted: #9a8e95; --rail-hover: #3a3036;
  --radius: 22px; --radius-sm: 14px; --radius-xs: 12px;
  --font: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  --display: "Segoe UI", "Microsoft YaHei", sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --shadow: 0 12px 32px rgba(60, 30, 45, 0.07);
  --shadow-lg: 0 24px 60px rgba(60, 30, 45, 0.1);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font); color: var(--ink);
  background:
    radial-gradient(900px 480px at 8% -10%, rgba(243, 192, 209, 0.45), transparent 55%),
    radial-gradient(700px 420px at 100% 0%, rgba(212, 87, 138, 0.1), transparent 50%),
    linear-gradient(180deg, #fffafb 0%, var(--bg) 42%, #f6f0f3 100%);
  background-attachment: fixed; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
.hidden { display: none !important; }
h1, h2 { margin: 0 0 0.5rem; font-family: var(--display); letter-spacing: -0.03em; }
.muted { color: var(--muted); }
.lead { color: var(--ink-soft); line-height: 1.55; }
.error { color: var(--danger); font-size: 0.9rem; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 0.4rem; margin: 0 0 0.75rem;
  padding: 0.28rem 0.7rem; border-radius: 999px; background: var(--accent-soft);
  color: var(--accent); font-size: 0.75rem; font-weight: 650;
}
.ghost, .linkish, .primary, .danger-btn, .secondary {
  border-radius: 999px; border: 1px solid var(--line); padding: 0.45rem 0.95rem; background: var(--surface);
}
.ghost:hover, .secondary:hover { background: var(--bg-soft); }
.linkish { border: 0; background: transparent; color: var(--accent); padding: 0.35rem 0; }
.primary { background: var(--cta); color: var(--cta-ink); border-color: var(--cta); font-weight: 600; }
.primary:hover { filter: brightness(1.08); }
.primary:disabled, .ghost:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
.danger-btn { background: #fff5f6; color: var(--danger); border-color: #f3c4c9; }
.block { width: 100%; display: block; }
label { display: block; font-size: 0.85rem; font-weight: 600; margin: 0.65rem 0 0.35rem; color: var(--ink-soft); }
input, select, textarea {
  width: 100%; border: 1px solid var(--line-strong); border-radius: var(--radius-xs);
  padding: 0.65rem 0.8rem; background: #fff; color: var(--ink);
}
.status {
  display: inline-flex; align-items: center; padding: 0.15rem 0.55rem; border-radius: 999px;
  font-size: 0.75rem; font-weight: 650;
}
.status-succeeded, .status-completed { background: rgba(47,157,106,.12); color: var(--ok); }
.status-running, .status-queued, .status-pending { background: rgba(217,139,60,.14); color: var(--warn); }
.status-failed, .status-failed_refunded { background: rgba(226,85,99,.12); color: var(--danger); }
.status-draft { background: var(--bg-soft); color: var(--muted); }

/* Auth — from v1 */
.auth-page { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.25rem; overflow: hidden; }
.auth-page::before, .auth-page::after {
  content: ""; position: absolute; border-radius: 50%; filter: blur(40px); pointer-events: none; z-index: 0;
}
.auth-page::before { width: 420px; height: 420px; top: -80px; left: -60px; background: rgba(243,192,209,.55); }
.auth-page::after { width: 380px; height: 380px; right: -40px; bottom: -60px; background: rgba(212,87,138,.16); }
.auth-shell {
  position: relative; z-index: 1; width: min(1200px, 100%);
  display: grid; grid-template-columns: 1.2fr 0.9fr; gap: 1.25rem;
}
.auth-hero {
  padding: 2rem; border-radius: 28px;
  background: linear-gradient(165deg, rgba(255,255,255,.7), rgba(255,249,251,.5));
  border: 1px solid rgba(255,255,255,.85); box-shadow: var(--shadow);
  display: flex; flex-direction: column; min-height: 560px;
}
.auth-hero-mosaic {
  display: grid; grid-template-columns: 1.35fr 1fr 1fr; grid-template-rows: 1fr 1fr;
  gap: 0.7rem; flex: 1; min-height: 280px; margin-bottom: 1.25rem;
}
.auth-tile {
  border-radius: 18px; overflow: hidden; position: relative;
  box-shadow: var(--shadow);
}
.auth-tile:nth-child(1) { grid-row: span 2; background: linear-gradient(160deg, #c45a7a, #f3c0d1); }
.auth-tile:nth-child(2) { background: linear-gradient(160deg, #e8d0b8, #f7efe6); }
.auth-tile:nth-child(3) { background: linear-gradient(160deg, #2a2430, #8a6a7a); }
.auth-tile::after {
  content: attr(data-label); position: absolute; left: 0.8rem; bottom: 0.7rem;
  color: #fff; font-size: 0.75rem; font-weight: 650; text-shadow: 0 1px 10px rgba(0,0,0,.35);
}
.brand-mark {
  font-family: var(--display); font-weight: 750; font-size: clamp(2.2rem, 4.8vw, 3.1rem);
  letter-spacing: -0.045em; line-height: 1.05; margin: 0 0 0.75rem;
}
.auth-panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 28px;
  padding: 2.2rem; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; justify-content: center;
}
.auth-panel h1 { font-size: 2rem; margin-bottom: 0.35rem; }
.auth-demo-hint { margin: 0.85rem 0 0; font-size: 0.82rem; }
.auth-switch { margin-top: 0.85rem; }

/* App chrome — v2 IA + v1 palette */
.app { min-height: 100vh; height: 100vh; display: flex; overflow: hidden; }
.rail {
  width: 84px; background: var(--rail); color: #f3e9ee;
  display: flex; flex-direction: column; align-items: center;
  padding: 16px 8px; gap: 22px; flex-shrink: 0;
}
.logo {
  width: 42px; height: 42px; border-radius: 12px;
  background: var(--accent); color: #fff; display: grid; place-items: center;
  font-weight: 800; letter-spacing: -1px; font-size: 0.85rem;
}
.rail nav { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.rail button {
  border: 0; background: transparent; color: var(--rail-muted);
  padding: 10px 4px; font-size: 11px; display: grid; gap: 5px; justify-items: center; width: 100%;
  border-radius: 12px;
}
.rail button.active, .rail button:hover { background: var(--rail-hover); color: #fff; }
.rail button .ico { font-size: 16px; line-height: 1; }
.shell { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 64px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; flex-shrink: 0;
  background: rgba(255, 250, 251, 0.86); backdrop-filter: blur(16px) saturate(1.15);
  border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--display); font-weight: 750; font-size: 1.15rem; letter-spacing: -0.03em; }
.brand span { color: var(--accent); }
.topbar strong { display: block; font-size: 1.05rem; margin-top: 1px; }
.top-actions { display: flex; align-items: center; gap: 10px; }
.balance-chip {
  display: inline-flex; align-items: baseline; gap: 0.3rem;
  padding: 0.4rem 0.85rem; border-radius: 999px; background: var(--accent-soft); font-size: 0.85rem; border: 0;
}
.balance-chip em { font-style: normal; color: var(--accent); font-weight: 700; }
.account { display: flex; align-items: center; gap: 8px; background: transparent; border: 0; position: relative; }
.avatar {
  width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-size: 12px; font-weight: 700;
}
.account-menu {
  position: absolute; right: 0; top: 36px; width: 180px; background: #fff;
  border: 1px solid var(--line); box-shadow: var(--shadow); z-index: 8; border-radius: 14px; padding: 6px;
}
.account-menu button {
  display: block; width: 100%; text-align: left; border: 0; background: #fff; padding: 9px 11px; font-size: 12px; border-radius: 10px;
}
.account-menu button:hover { background: var(--bg-soft); }
.page { max-width: 1280px; margin: 0 auto; padding: 28px 32px 72px; width: 100%; overflow-y: auto; flex: 1; }
.heading { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; gap: 16px; }
.heading h1 { font-size: 1.85rem; margin: 4px 0 6px; }
.heading p { margin: 0; }
.page-head { margin-bottom: 1.35rem; }
.page-head h1 { font-size: 1.85rem; }

.filterbar { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
.search {
  background: #fff; border: 1px solid var(--line); display: flex; align-items: center;
  gap: 8px; padding: 8px 12px; min-width: 260px; border-radius: 999px;
}
.search input { border: 0; outline: 0; width: 100%; background: transparent; padding: 0; }
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filters select { border: 1px solid var(--line); background: #fff; padding: 8px 10px; border-radius: 999px; width: auto; }

.project-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.project-grid.list { grid-template-columns: 1fr; }
.new-card, .project-card, .tpl-card, .hist-card, .panel {
  border: 1px solid var(--line); background: #fff; text-align: left; border-radius: 18px; box-shadow: var(--shadow);
}
.new-card {
  min-height: 232px; display: grid; place-items: center; align-content: center;
  gap: 7px; color: var(--muted); border-style: dashed; background: rgba(255,255,255,.55);
}
.new-mark {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
  display: grid; place-items: center; font-size: 24px; color: var(--ink);
}
.project-card { position: relative; overflow: hidden; }
.thumb {
  height: 132px; position: relative; overflow: hidden;
  border-bottom: 1px solid var(--line);
}
.thumb.a169 { background: linear-gradient(135deg, #d4578a, #f3c0d1); }
.thumb.a916 { background: linear-gradient(180deg, #c45a7a 0%, #eadfe4 100%); }
.thumb.a11 { background: linear-gradient(135deg, #8a5a6c, #f3c0d1); }
.thumb-corner, .thumb-cover {
  position: absolute; background: rgba(36,30,34,.55); color: #fff;
  font-size: 11px; padding: 3px 8px; border-radius: 999px;
}
.thumb-corner { right: 10px; top: 10px; }
.thumb-cover { left: 10px; bottom: 10px; }
.card-info { padding: 12px 14px 14px; }
.card-title { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; font-weight: 700; }
.card-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }
.card-status { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 12px; }
.more { border: 0; background: transparent; padding: 0 4px; color: var(--muted); }
.more-menu {
  position: absolute; right: 10px; top: 148px; width: 140px; background: #fff;
  border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); z-index: 4; padding: 4px;
}
.more-menu button { display: block; width: 100%; text-align: left; border: 0; background: #fff; padding: 8px 10px; border-radius: 8px; font-size: 12px; }
.more-menu button:hover { background: var(--bg-soft); }

.tpl-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.tpl-card { padding: 16px 18px 18px; }
.tpl-card h3 { margin: 0 0 6px; font-size: 1.05rem; }
.tpl-card .ver { color: var(--muted); font-size: 0.82rem; margin: 0 0 12px; min-height: 2.4em; }
.block-title { font-size: 1.1rem; margin: 1.5rem 0 0.85rem; }
.promo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.85rem; }
.promo-card {
  border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: #fff;
  text-align: left; padding: 0;
}
.promo-card:hover { box-shadow: var(--shadow); }
.promo-ph {
  width: 100%; height: 120px; display: grid; place-items: center; color: #fff; font-weight: 700;
  background: linear-gradient(135deg, #f3c0d1, #eadfe4 50%, #d4578a);
}
.promo-card-body { padding: 0.7rem 0.8rem 0.9rem; }
.promo-card-tag { font-size: 0.72rem; color: var(--accent); font-weight: 700; }
.promo-card-title { font-size: 0.95rem; font-weight: 700; margin: 0.2rem 0; }
.promo-card-brand { font-size: 0.78rem; color: var(--muted); }
.tag-filters { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1rem; }
.tag-filters button, .filter-tabs button {
  border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 0.35rem 0.75rem; font-size: 0.82rem;
}
.tag-filters button.active, .filter-tabs button.active { background: var(--accent-soft); color: var(--accent); border-color: var(--rose); font-weight: 650; }

.empty-panel {
  max-width: 640px; margin: 48px auto; text-align: center;
  background: #fff; border: 1px dashed var(--line); border-radius: 22px; padding: 40px 32px;
  box-shadow: var(--shadow);
}
.empty-actions { display: flex; justify-content: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

.history-list { display: flex; flex-direction: column; gap: 0.55rem; }
.history-row {
  border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 0.85rem 1rem;
  display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; align-items: center;
}
.history-row:hover { border-color: var(--rose); }
.history-row.deferred { opacity: 0.62; cursor: default; background: var(--pearl); }
.history-row.deferred:hover { border-color: var(--line); }
.wall-card { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: #fff; padding: 0; }
.history-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.85rem; margin-bottom: 1.6rem; }
.wall-card .thumb {
  height: 120px; color: #fff; display: grid; place-items: center; font-weight: 700; border: 0;
}
.wall-card .body { padding: 0.7rem 0.8rem; }

.admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.panel { padding: 1.1rem 1.2rem; }
.panel h2 { font-size: 1.1rem; margin-bottom: 0.75rem; }
.table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.table th, .table td { text-align: left; padding: 0.55rem 0.4rem; border-bottom: 1px solid var(--line); }
.chip-ok { color: var(--ok); font-weight: 650; }
.chip-off { color: var(--muted); }
.channel-card {
  border: 1px solid var(--line); border-radius: 14px; padding: .75rem .85rem; margin-bottom: .55rem; background: #fff;
}
.channel-card .row { display: flex; justify-content: space-between; gap: .5rem; align-items: baseline; }
.channel-card .meta { font-size: .78rem; color: var(--muted); margin: .25rem 0 .45rem; }

.ledger-list { max-height: 360px; overflow: auto; }
.ledger-row {
  display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
  padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.88rem;
}
.ledger-amt.is-debit { color: var(--danger); }
.ledger-amt.is-credit { color: var(--ok); }
.studio-thin { max-width: 560px; }
.studio-job {
  margin-top: 1rem; padding: 0.85rem 1rem; border: 1px solid var(--line); border-radius: 14px; background: #fff;
}

/* Canvas — from v1 docks */
.canvas-app { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; background: #fffafb; }
.cv-stage { position: relative; flex: 1; min-height: 0; background:
  radial-gradient(circle at 1px 1px, rgba(212,87,138,.18) 1px, transparent 0) 0 0 / 22px 22px,
  linear-gradient(180deg, #fffafb, #f7eef2);
}
.cv-topbar {
  position: absolute; top: 0.85rem; left: 50%; transform: translateX(-50%); z-index: 5;
  display: flex; align-items: center; gap: 0.65rem; padding: 0.45rem 0.65rem;
  background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow);
  white-space: nowrap;
}
.cv-topbar-name {
  border: 0; background: transparent; font-weight: 700; min-width: 8rem; max-width: 14rem;
  padding: .2rem .35rem; border-radius: 8px; color: var(--ink);
}
.cv-topbar-name:hover, .cv-topbar-name:focus { background: var(--bg-soft); outline: none; }
.cv-dock {
  position: absolute; z-index: 4; top: 4.2rem; width: 268px; max-height: calc(100% - 5rem);
  overflow: hidden; background: rgba(255,255,255,.94); border: 1px solid var(--line);
  border-radius: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column;
}
.cv-dock.left { left: 0.85rem; }
.cv-dock.right { right: 0.85rem; width: 300px; }
.cv-dock.is-collapsed { width: 44px; }
.cv-dock.is-collapsed .cv-dock-body { display: none; }
.cv-dock-head {
  display: flex; align-items: center; justify-content: space-between; gap: .5rem;
  padding: .7rem .75rem; border-bottom: 1px solid var(--line); flex-shrink: 0;
}
.cv-dock-head strong { font-size: .9rem; }
.cv-dock-tabs { display:flex; gap:4px; padding: 0 .75rem .55rem; }
.cv-dock-tabs button {
  flex:1; border:1px solid var(--line); background:#fff; border-radius:999px; padding:.28rem 0; font-size:.75rem;
}
.cv-dock-tabs button.active { background: var(--accent-soft); color: var(--accent); border-color: var(--rose); font-weight:650; }
.asset-item {
  width:100%; text-align:left; margin:.25rem 0; border:1px solid var(--line); background:#fff;
  border-radius:12px; padding:.5rem .65rem; font-size:.82rem;
}
.asset-item small { display:block; color:var(--muted); font-size:.72rem; margin-top:.15rem; }
.cv-dock-body { padding: 0.75rem 0.85rem; overflow: auto; flex: 1; }
.cv-dock .section { margin-bottom: 0.9rem; }
.cv-panel-toggle {
  border: 1px solid var(--line); background: #fff; border-radius: 10px;
  width: 28px; height: 28px; padding: 0; font-size: 1rem; line-height: 1;
}
.cv-controls {
  position: absolute; left: .85rem; bottom: .85rem; z-index: 4;
  display: flex; flex-direction: column; gap: .35rem;
}
.cv-controls button {
  width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line);
  background: rgba(255,255,255,.95); box-shadow: var(--shadow); font-weight: 700;
}
.cv-minimap {
  position: absolute; right: .85rem; bottom: .85rem; z-index: 4;
  width: 140px; height: 92px; border-radius: 12px; border: 1px solid var(--line);
  background: rgba(255,249,251,.92); box-shadow: var(--shadow); overflow: hidden;
}
.cv-minimap-world { position: absolute; inset: 8px; }
.cv-minimap-node { position: absolute; width: 10px; height: 7px; border-radius: 2px; background: #d4578a; opacity: .85; }
.palette-btn, .tpl-btn, .draft-btn {
  width: 100%; text-align: left; margin: 0.25rem 0; border: 1px solid var(--line);
  background: #fff; border-radius: 12px; padding: 0.5rem 0.65rem; font-size: 0.82rem;
}
.tpl-btn.active, .draft-btn.active { border-color: var(--accent); background: var(--pearl); }
.palette-btn small, .tpl-btn small { display: block; color: var(--muted); font-size: 0.72rem; margin-top: 0.15rem; }
.cv-block {
  position: absolute; top: 4.1rem; left: 50%; transform: translateX(-50%); z-index: 6;
  max-width: min(720px, calc(100% - 2rem));
  background: rgba(255,250,251,.95); border: 1px dashed rgba(212,87,138,.35);
  color: var(--ink-soft); padding: 0.55rem 0.9rem; border-radius: 12px; font-size: 0.85rem;
  box-shadow: var(--shadow);
}
.cv-block strong { color: var(--ink); margin-right: .4rem; }
.cv-board { position: absolute; inset: 0; overflow: hidden; cursor: grab; }
.cv-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.cv-edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.cv-node { position: absolute; width: 260px; background: transparent; border: none; user-select: none; cursor: grab; overflow: visible; }
.cv-card {
  border-radius: 16px; background: linear-gradient(165deg, #fff 0%, #fff7fa 100%);
  border: 1px solid rgba(212,87,138,.22); box-shadow: var(--shadow); overflow: hidden;
}
.cv-node.selected .cv-card {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px rgba(212,87,138,.35), 0 0 0 6px rgba(212,87,138,.1), var(--shadow-lg);
}
.cv-node.st-running .cv-card { border-color: rgba(212,87,138,.75); }
.cv-card-top { display: flex; align-items: center; justify-content: space-between; gap: .4rem; padding: .55rem .65rem .35rem; }
.cv-kind {
  display: inline-flex; align-items: center; gap: .3rem; padding: .15rem .45rem;
  border-radius: 999px; font-size: .68rem; font-weight: 650; background: var(--accent-soft); color: var(--accent);
}
.cv-kind.tone-text { color:#9a4a6e; background:rgba(212,87,138,.1); }
.cv-kind.tone-image { color:#2a7a55; background:rgba(47,157,106,.12); }
.cv-kind.tone-gen, .cv-kind.tone-video { color:#9a5a22; background:rgba(217,139,60,.12); }

<script>

const PROMOS = [

TPL.standard.edges = TPL.beauty_linear.edges.map(e=>e.slice());

const state = {
  route: "workspace",
  query: "",
  filter: "all",
  menu: -1,
  showTag: "全部",
  newMode: "blank",

    { id:"a2", kind:"output", name:"当前成片.mp4", project:"p1" },

  projects: [

  ],

    { id:1, name:"本地seedance模拟版", provider:"mock", model_id:"seedance-local-simulate", upstream:"local-simulate", key:"mock:****", cost:0, enabled:true },

    { email:"demo@example.com", role:"user", balance:20 }
  ],
  wf: { projectId:"p1", name:"春夏唇釉 TVC", tpl:"beauty_linear", running:false, selected:"shot", zoom:1, nodes:[], edges:[] }
};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function toast(msg){
  const el=$("toast"); el.textContent=msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"), 2200);
}
function money(n){ return Number(n).toFixed(2); }
function statusLabel(s){
  return ({draft:"未出片", queued:"排队中", running:"生成中", succeeded:"已完成", failed:"失败"})[s]||s;
}
function nowLabel(){ return "刚刚"; }
function addSpend(title, amount, kind){
  state.balance = Math.round((state.balance + amount)*100)/100;
  state.users[0].balance = state.balance;
  $("bal").textContent = money(state.balance);
  state.spends.unshift({ title, amount, kind, at: nowLabel() });
}
function hasModel(){ return state.channels.some(c=>c.enabled); }
function cannotRunReason(){
  const nodes=state.wf.nodes;
  if(!nodes.length) return "画布上没有节点，无法生成。请从左侧「节点」添加「图生视频」等节点，或用模板预填后再一键跑。";
  const runnable=nodes.some(n=>["ImageToVideo","VideoTrim","VideoMux","VideoAsset"].includes(n.type));
  if(!runnable) return "没有可出片的节点。请添加「图生视频」「裁时长」或「真拼接」后再一键跑。";
  if(!hasModel()) return "暂无可用模型，无法图生视频。请超管启用渠道后再一键跑。";
  return null;
}
function syncRunBlock(){
  const el=$("cv-block"); if(!el) return;
  const reason=cannotRunReason();
  const runBtn=$("wf-run");
  if(reason){
    el.classList.remove("hidden");
    el.innerHTML=`<strong>无法生成</strong><span>${esc(reason)}</span>`;
    if(runBtn){ runBtn.disabled=true; runBtn.title=reason; }
  } else {
    el.classList.add("hidden");
    if(runBtn){ runBtn.disabled=!!state.wf.running; runBtn.title=""; }
  }
}

/* ---------- Auth ---------- */
function enterApp(msg){
  $("view-login").classList.add("hidden");
  $("view-app").classList.remove("hidden");
  setRoute("workspace");
  toast(msg);
}
$("auth-toggle").onclick = ()=>{
  state.authMode = state.authMode==="login" ? "register" : "login";
  const reg=state.authMode==="register";
  $("auth-title").textContent = reg ? "创建品牌账号" : "进入工作区";
  $("auth-submit").textContent = reg ? "注册并开始" : "开始创作";
  $("auth-toggle").textContent = reg ? "已有账号？登录" : "没有账号？注册";
  $("auth-nick-wrap").classList.toggle("hidden", !reg);
};
$("auth-form").onsubmit = (e)=>{
  e.preventDefault();
  if(!$("auth-email").value.trim() || !$("auth-pass").value.trim()){
    $("auth-error").textContent="请填写邮箱和密码"; $("auth-error").classList.remove("hidden"); return;
  }
  if(state.authMode==="register"){
    addSpend("注册赠送", 20, "赠送");
    enterApp("已注册并进入工作区");
  } else {
    enterApp("已登录");
  }
};
$("btn-studio").onclick = (e)=>{
  e.stopPropagation();
  $("account-menu").classList.add("hidden");
  $("view-canvas").classList.add("hidden");
  setRoute("studio");
};
$("btn-logout").onclick = ()=>{
  $("view-app").classList.add("hidden");
  $("view-canvas").classList.add("hidden");
  $("view-login").classList.remove("hidden");
  $("account-menu").classList.add("hidden");
  toast("已退出");
};
$("btn-account").onclick = (e)=>{
  e.stopPropagation();
  $("account-menu").classList.toggle("hidden");
};
$("btn-balance").onclick = ()=>{ state.modal="balance"; renderModal(); };
document.addEventListener("click", ()=> $("account-menu").classList.add("hidden"));

/* ---------- Routing ---------- */
function setRoute(route){
  if(route==="history") route="workspace";
  state.route = route;
  state.menu = -1;
  $("top-title").textContent = TITLES[route] || route;
  $("bal").textContent = money(state.balance);
  document.querySelectorAll("#rail-nav button").forEach(b=>b.classList.toggle("active", b.dataset.route===route));
  $("page").innerHTML = pages[route] ? pages[route]() : pages.workspace();
  bindPage();
}
function renderRail(){
  $("rail-nav").innerHTML = ROUTES.map(r=>
    `<button type="button" data-route="${r.id}" class="${state.route===r.id?"active":""}" title="${r.title}">
      <span class="ico">${r.icon}</span><span>${r.title}</span>
    </button>`
  ).join("");
  $("rail-nav").onclick = (e)=>{
    const b=e.target.closest("button"); if(!b) return;
    setRoute(b.dataset.route);
  };
}

const pages = {
  workspace(){
    const q=state.query.trim().toLowerCase();
    const list=state.projects.filter(p=>{
      if(q && !(`${p.name} ${p.brand}`).toLowerCase().includes(q)) return false;
      if(state.filter==="done" && p.status!=="succeeded") return false;
      if(state.filter==="wip" && p.status==="succeeded") return false;
      return true;
    });
    return `

function bindPage(){
  const p=$("page");
  const qEl=p.querySelector("#ws-q");
  qEl?.addEventListener("input", e=>{
    const caret=e.target.selectionStart;
    state.query=e.target.value;
    setRoute("workspace");
    const nq=$("page").querySelector("#ws-q");
    if(nq){ nq.focus(); nq.setSelectionRange(caret, caret); }
  });
  p.querySelector("#ws-filter")?.addEventListener("change", e=>{ state.filter=e.target.value; setRoute("workspace"); });
  p.querySelector("#btn-new")?.addEventListener("click", openNew);
  p.querySelector("#btn-new-card")?.addEventListener("click", openNew);
  p.querySelectorAll("[data-open]").forEach(el=>el.addEventListener("click", e=>{
    if(e.target.closest(".more, .more-menu")) return;
    openProject(el.dataset.open);
  }));
  p.querySelectorAll("[data-menu]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const i=Number(b.dataset.menu);
    state.menu = state.menu===i ? -1 : i;
    setRoute("workspace");
  });
  p.querySelectorAll("[data-dup]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const src=state.projects.find(x=>x.id===b.dataset.dup);
    state.projects.unshift({...src, id:"p"+Date.now(), name:src.name+" 副本", status:"draft", cover:src.cover||"", updated:"刚刚", tpl:src.tpl, aspect:src.aspect, brand:src.brand});
    state.menu=-1; setRoute("workspace"); toast("已复制项目");
  });
  p.querySelectorAll("[data-del]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    if(!confirm("删除项目将去掉画布、当前成片和本项目素材。确定？")) return;
    state.assets=state.assets.filter(a=>a.project!==b.dataset.del);
    state.projects=state.projects.filter(x=>x.id!==b.dataset.del);
    state.menu=-1; setRoute("workspace"); toast("已删除项目");
  });
  p.querySelectorAll("[data-use-tpl]").forEach(b=>b.onclick=()=>useTpl(b.dataset.useTpl));
  p.querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{ state.showTag=b.dataset.tag; setRoute("templates"); });
  p.querySelectorAll("[data-promo]").forEach(b=>b.onclick=()=>{
    const promo=PROMOS.find(x=>x.id===b.dataset.promo);
    useTpl("quick_shot", promo.title, promo.prompt);
  });
  p.querySelector("[data-go]")?.addEventListener("click", ()=>setRoute("workspace"));
  p.querySelector("#open-makeup")?.addEventListener("click", ()=>useTpl("beauty_linear"));
  p.querySelectorAll("[data-toggle-ch]").forEach(b=>b.onclick=()=>{
    const c=state.channels.find(x=>x.id==b.dataset.toggleCh);
    c.enabled=!c.enabled; setRoute("admin"); toast(c.enabled?"已启用":"已停用");
  });
  p.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>{
    const c=state.channels.find(x=>x.id==b.dataset.key);
    c.key="****"+Math.random().toString(16).slice(2,6); setRoute("admin"); toast("已更新 Key（示意）");
  });
  p.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{
    const u=state.users[Number(b.dataset.u)];
    const v=prompt("新余额", String(u.balance));
    if(v==null) return;
    u.balance=Number(v)||0;
    if(u.email==="admin@example.com"){
      const delta=u.balance-state.balance;
      addSpend("超管调整余额", delta, "超管");
    }
    setRoute("admin"); toast("余额已更新");
  });
  p.querySelectorAll("[data-ledger]").forEach(b=>b.onclick=()=>{
    state.modal = Number(b.dataset.ledger)===0 ? "balance" : "user-ledger";
    renderModal();
  });
  const PRESET={
    lite:{name:"火山方舟 · Seedance Lite", provider:"ark", model:"seedance-lite", upstream:"doubao-seedance-1-0-lite-t2v-250428", cost:1},
    "25":{name:"火山方舟 · Seedance 2.5", provider:"ark", model:"seedance-2.5", upstream:"doubao-seedance-2-0-260128", cost:8},
    mock:{name:"本地seedance模拟版", provider:"mock", model:"seedance-local-simulate", upstream:"local-simulate", cost:0},
    agnes:{name:"Agnes AI Pavo", provider:"agnes", model:"agnes-pavo", upstream:"agnes-video-v2.0", cost:0}
  };
  p.querySelector("#ch-preset")?.addEventListener("change", e=>{
    const x=PRESET[e.target.value]; if(!x) return;
    $("ch-name").value=x.name; $("ch-provider").value=x.provider; $("ch-model").value=x.model;
    $("ch-upstream").value=x.upstream; $("ch-cost").value=x.cost;
  });
  p.querySelector("#ch-add")?.addEventListener("click", ()=>{
    state.channels.push({
      id:Date.now(), name:$("ch-name").value, provider:$("ch-provider").value,
      model_id:$("ch-model").value, upstream:$("ch-upstream").value,
      key:"****new", cost:Number($("ch-cost").value)||0, priority:50, enabled:false
    });
    setRoute("admin"); toast("已添加渠道（默认停用）");
  });
  p.querySelector("#st-prompt")?.addEventListener("input", e=>{ state.studioPrompt=e.target.value; });
  const stImg=p.querySelector("#st-img");
  if(stImg) stImg.onclick=()=>toast("已选择参考图");
  const stRun=p.querySelector("#st-run");
  if(stRun) stRun.onclick=()=>runStudio();
}

function openNew(){ state.modal="new"; renderModal(); }
function useTpl(id, name, briefText){
  const t=TPL[id];
  const proj={
    id:"p"+Date.now(), name: name || t.name, brand:"SeeMe", aspect:"16:9",
    status:"draft", cover:"", updated:"刚刚", tpl:id
  };
  state.projects.unshift(proj);
  openProject(proj.id, briefText);
  toast("已用模板新建项目");
}
function openProject(id, briefText){
  const p=state.projects.find(x=>x.id===id) || state.projects[0];
  loadTpl(p.tpl || "beauty_linear");
  state.wf.projectId = p.id;
  state.wf.name = p.name;
  if(briefText){
    const brief=state.wf.nodes.find(n=>n.id==="brief"||n.type==="TextAsset");
    if(brief) brief.text=briefText;
  }
  $("wf-name").value = state.wf.name;
  $("view-canvas").classList.remove("hidden");
  renderWorkflow();
}
function runStudio(){
  if(!hasModel()){ toast("暂无可用模型"); return; }
  const id=state.runSeq++;
  const mock=state.channels.some(c=>c.enabled && c.cost===0);
  const cost=mock?0:5;
  addSpend(`工作室出片 #${id}`, -cost, "扣费");
  state.studioJob={id, status:"running", cost};
  setRoute("studio");
  setTimeout(()=>{
    if(!state.studioJob || state.studioJob.id!==id) return;
    state.studioJob.status="succeeded";
    setRoute("studio");
    toast("工作室出片完成");
  }, 1400);
}

/* ---------- Modal ---------- */
function closeModal(){ state.modal=null; $("modal").classList.add("hidden"); $("modal").innerHTML=""; }
function renderModal(){
  const box=$("modal");
  if(!state.modal){ closeModal(); return; }
  box.classList.remove("hidden");
  if(state.modal==="balance" || state.modal==="user-ledger"){
    const rows = state.modal==="user-ledger"
      ? [{ title:"期初余额", amount:20, kind:"期初", at:"8 月 1 日" }]
      : state.spends;
    box.innerHTML=`<div class="modal" onclick="event.stopPropagation()">
      <h2>消费明细</h2>
      <div class="ledger-list">${rows.map(s=>`<div class="ledger-row">
        <div><strong>${esc(s.title)}</strong><div class="muted">${esc(s.kind||"")} · ${esc(s.at)}</div></div>
        <div class="ledger-amt ${s.amount<0?"is-debit":"is-credit"}">${s.amount>0?"+":""}${money(s.amount)}</div>
      </div>`).join("")}</div>
      <div class="modal-actions"><button class="primary" type="button" id="m-close">关闭</button></div>
    </div>`;
  } else if(state.modal==="new"){
    box.innerHTML=`<div class="modal" onclick="event.stopPropagation()">
      <h2>新建项目</h2>
      <label>名称<input id="newName" placeholder="例如：秋季底妆新品 TVC" /></label>
      <label>品牌<input id="newBrand" value="SeeMe" /></label>
      <label>起始方式</label>
      <div class="mode-grid">
        <button type="button" class="mode-card ${state.newMode==="blank"?"active":""}" data-mode="blank"><strong>＋ 空白项目</strong><small>单镜头快出（Brief + 图）</small></button>
        <button type="button" class="mode-card ${state.newMode==="template"?"active":""}" data-mode="template"><strong>▣ 官方模板</strong><small>预填官方美妆节点</small></button>
      </div>
      ${state.newMode==="template"?`<label>模板<select id="newTpl">
        <option value="beauty_linear">美妆线性链路</option>
        <option value="standard">标准美妆 TVC</option>
        <option value="quick_shot">单镜头快出</option>
      </select></label>`:""}
      <div class="modal-actions">
        <button class="ghost" type="button" id="m-close">取消</button>
        <button class="primary" type="button" id="m-create">创建并打开</button>
      </div>
    </div>`;
  }
  box.onclick = (e)=>{ if(e.target===box) closeModal(); };
  box.querySelector("#m-close")?.addEventListener("click", closeModal);
  box.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ state.newMode=b.dataset.mode; renderModal(); });
  box.querySelector("#m-create")?.addEventListener("click", ()=>{
    const name=$("newName").value.trim() || "未命名项目";
    const brand=$("newBrand").value.trim() || "SeeMe";
    const tpl=state.newMode==="template" ? ($("newTpl")?.value || "beauty_linear") : "quick_shot";
    const proj={ id:"p"+Date.now(), name, brand, aspect:"16:9", status:"draft", cover:"", updated:"刚刚", tpl };
    state.projects.unshift(proj);
    closeModal();
    openProject(proj.id);
  });
}

/* ---------- Canvas ---------- */
function loadTpl(id){
  const t=TPL[id] || TPL.beauty_linear;
  state.wf.tpl=id;
  state.wf.nodes = t.nodes.map(n=>({...n}));
  state.wf.edges = t.edges.map(e=>e.slice());
  state.wf.selected = state.wf.nodes[0]?.id || null;
  document.querySelectorAll(".tpl-btn").forEach(b=>b.classList.toggle("active", b.dataset.tpl===id));
}
function nodeCenter(n){ return {x:n.x+130, y:n.y+80}; }
function drawEdges(){
  $("cv-edges").innerHTML = state.wf.edges.map(([a,b])=>{
    const na=state.wf.nodes.find(n=>n.id===a), nb=state.wf.nodes.find(n=>n.id===b);
    if(!na||!nb) return "";
    const p1=nodeCenter(na), p2=nodeCenter(nb);
    const mid=(p1.x+p2.x)/2;
    return `<path d="M${p1.x},${p1.y} C${mid},${p1.y} ${mid},${p2.y} ${p2.x},${p2.y}" stroke="#d4578a" stroke-width="2.5" fill="none" opacity=".75"/>`;
  }).join("");
}
function toneOf(type){
  if(type==="TextAsset") return "text";
  if(type==="ImageAsset") return "image";
  if(type==="ImageToVideo" || type==="VideoAsset") return "video";
  return "tool";
}
function kindLabel(type){
  return ({TextAsset:"文本",ImageAsset:"图片",ImageToVideo:"图生视频",VideoTrim:"裁时长",VideoMux:"拼接",VideoAsset:"视频"})[type]||type;
}
function renderMinimap(){
  const box=$("cv-minimap-world"); box.innerHTML="";
  state.wf.nodes.forEach(n=>{
    const d=document.createElement("div"); d.className="cv-minimap-node";
    d.style.left=(n.x/18)+"px"; d.style.top=(n.y/18)+"px";
    box.appendChild(d);
  });
}
function renderInspector(){
  const n=state.wf.nodes.find(x=>x.id===state.wf.selected);
  const box=$("wf-inspector");
  if(!n){
    box.innerHTML=`<h2 style="font-size:1.05rem">选择节点</h2><p class="muted">点击画布节点查看示意字段。</p><div id="ins-fields"></div>`;
    return;
  }
  const fields = n.type==="TextAsset"
    ? `<label>文本角色<select id="ins-role"><option>brief</option><option>script</option><option>prompt</option></select></label>
       <label>内容<textarea id="ins-text" rows="5">${esc(n.text||"")}</textarea></label>`
    : n.type==="ImageAsset"
    ? `<label>妆前提示词<input value="素颜自然肤质" /></label><label>妆后提示词<input value="精致妆容，气色明亮" /></label>`
    : n.type==="ImageToVideo"
    ? `<label>模型<select><option>seedance-local-simulate</option><option>seedance-lite</option><option>seedance-2.5</option></select></label>
       <label>时长（秒）<input type="number" value="5" /></label>`
    : n.type==="VideoTrim"
    ? `<label>trim_start<input type="number" value="0" /></label><label>trim_end<input type="number" value="4" /></label>`
    : n.type==="VideoMux"
    ? `<label>画幅<select><option>16:9</option><option>9:16</option><option>1:1</option></select></label>`
    : `<p class="muted">成片载体。成功后覆盖为当前成片。</p>`;
  box.innerHTML=`<p class="eyebrow">${kindLabel(n.type)}</p>
    <h2 style="font-size:1.05rem">${esc(n.label)}</h2>
    <p class="muted">id: ${esc(n.id)} · ${esc(n.type)}</p>
    ${fields}
    ${["ImageToVideo","VideoTrim","VideoMux"].includes(n.type)?`<button type="button" class="primary" id="ins-gen" style="margin-top:.8rem">生成此节点</button>`:""}
    <button type="button" class="danger-btn" id="ins-del" style="margin-top:.5rem">删除节点</button>`;
  box.querySelector("#ins-text")?.addEventListener("input", e=>{ n.text=e.target.value; });
  box.querySelector("#ins-gen")?.addEventListener("click", ()=>{
    n.status="running"; renderNodes();
    setTimeout(()=>{ n.status="succeeded"; renderNodes(); toast("节点生成完成（示意，无上游）"); }, 1100);
  });
  box.querySelector("#ins-del")?.addEventListener("click", ()=>{
    state.wf.nodes=state.wf.nodes.filter(x=>x.id!==n.id);
    state.wf.edges=state.wf.edges.filter(([a,b])=>a!==n.id && b!==n.id);
    state.wf.selected=state.wf.nodes[0]?.id||null;
    renderWorkflow();
  });
}
function renderNodes(){
  const host=$("cv-nodes");
  host.innerHTML = state.wf.nodes.map(n=>{
    const tone=toneOf(n.type);
    return `<div class="cv-node ${state.wf.selected===n.id?"selected":""} ${n.status==="running"?"st-running":""}" data-nid="${n.id}" style="left:${n.x}px;top:${n.y}px">
      <div class="cv-card">
        <div class="cv-card-top"><span class="cv-kind tone-${tone}">${kindLabel(n.type)}</span>
          ${n.status?`<span class="status status-${n.status}">${statusLabel(n.status)}</span>`:""}</div>
        <div class="cv-media">${esc(n.text||kindLabel(n.type))}</div>
        <div class="cv-card-foot"><div class="cv-node-name">${esc(n.label)}</div>
          <div class="cv-port-hints"><span>in</span><span>out</span></div></div>
      </div>
    </div>`;
  }).join("");
  host.querySelectorAll(".cv-node").forEach(el=>{
    el.onmousedown = (e)=>{
      state.wf.selected=el.dataset.nid; renderInspector();
      host.querySelectorAll(".cv-node").forEach(n=>n.classList.toggle("selected", n===el));
      const node=state.wf.nodes.find(x=>x.id===el.dataset.nid);
      const sx=e.clientX, sy=e.clientY, ox=node.x, oy=node.y;
      const move=(ev)=>{ node.x=ox+(ev.clientX-sx)/state.wf.zoom; node.y=oy+(ev.clientY-sy)/state.wf.zoom; el.style.left=node.x+"px"; el.style.top=node.y+"px"; drawEdges(); };
      const up=()=>{ window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); renderMinimap(); };
      window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
    };
  });
  drawEdges(); renderMinimap();
}
function renderWorkflow(){
  $("cv-world").style.transform = `scale(${state.wf.zoom})`;
  $("wf-queue").textContent = state.wf.running ? "生成中（同时一只）" : "队列空闲";
  $("wf-cancel").disabled = !state.wf.running;
  renderNodes(); renderInspector(); syncRunBlock();
}

$("wf-back").onclick = ()=>{
  $("view-canvas").classList.add("hidden");
  setRoute("workspace");
};
$("wf-save").onclick = ()=>{
  const p=state.projects.find(x=>x.id===state.wf.projectId);
  if(p){ p.name=state.wf.name; p.updated=nowLabel(); }
  toast("已保存项目");
};
$("wf-run").onclick = ()=>{
  const reason=cannotRunReason();
  if(reason){ syncRunBlock(); toast(reason); return; }
  if(state.wf.running) return;
  const id=state.runSeq++;
  const mock=state.channels.some(c=>c.enabled && c.cost===0);
  const cost=mock?0:5;
  state.pendingCharge=cost;
  addSpend(`项目出片 #${id} 镜头`, -cost, "扣费");
  state.wf.running=true;
  const proj=state.projects.find(x=>x.id===state.wf.projectId);
  if(proj) proj.status="running";
  renderWorkflow();
  state._runTimer=setTimeout(()=>{
    state.wf.running=false;
    state.pendingCharge=0;
    state.wf.nodes.forEach(n=>{ if(["ImageToVideo","VideoTrim","VideoMux","VideoAsset"].includes(n.type)) n.status="succeeded"; });
    if(proj){ proj.status="succeeded"; proj.cover="output"; proj.updated=nowLabel(); }
    const old=state.assets.find(a=>a.project===state.wf.projectId && a.kind==="output");
    if(old) old.name="当前成片.mp4";
    else state.assets.unshift({id:"a"+Date.now(), kind:"output", name:"当前成片.mp4", project:state.wf.projectId});
    renderWorkflow(); toast("出片完成");
  }, 1600);
};
$("wf-cancel").onclick = ()=>{
  clearTimeout(state._runTimer);
  if(state.pendingCharge){
    addSpend(`项目出片整单退款`, state.pendingCharge, "退款");
    state.pendingCharge=0;
  }
  state.wf.running=false;
  const proj=state.projects.find(x=>x.id===state.wf.projectId);
  if(proj && proj.status==="running") proj.status="draft";
  renderWorkflow(); toast("已取消");
};
$("wf-name").oninput = e=>{
  state.wf.name=e.target.value;
  const p=state.projects.find(x=>x.id===state.wf.projectId);
  if(p) p.name=e.target.value;
};
$("dock-left-toggle").onclick = ()=> $("dock-left").classList.toggle("is-collapsed");
$("dock-right-toggle").onclick = ()=> $("dock-right").classList.toggle("is-collapsed");
function renderAssets(){
  const box=$("asset-list"); if(!box) return;
  const items=state.assets.filter(a=>state.assetKind==="all"||a.kind===state.assetKind);
  const kindLabel={image:"图",video:"视频",output:"成片"};
  box.innerHTML = items.map(a=>`<div class="asset-item"><strong>${esc(a.name)}</strong><small>${kindLabel[a.kind]||a.kind}
    · <button type="button" class="linkish" data-copy-asset="${a.id}">复制到其他项目</button></small></div>`).join("") || `<p class="muted">暂无素材</p>`;
  box.querySelectorAll("[data-copy-asset]").forEach(b=>b.onclick=()=>{
    const other=state.projects.find(p=>p.name!==state.wf.name) || state.projects[0];
    toast(other?`已复制到「${other.name}」（示意）`:"没有其他项目");
  });
}
function setLeftTab(tab){
  state.leftTab=tab;
  document.querySelectorAll("[data-left-tab]").forEach(b=>b.classList.toggle("active", b.dataset.leftTab===tab));
  $("dock-left-nodes").classList.toggle("hidden", tab!=="nodes");
  $("dock-left-assets").classList.toggle("hidden", tab!=="assets");
  $("dock-left-title").textContent = tab==="assets" ? "素材" : "节点";
  if(tab==="assets") renderAssets();
}
document.querySelectorAll("[data-left-tab]").forEach(b=>b.onclick=()=>setLeftTab(b.dataset.leftTab));
document.querySelectorAll("[data-akind]").forEach(b=>b.onclick=()=>{
  state.assetKind=b.dataset.akind;
  document.querySelectorAll("[data-akind]").forEach(x=>x.classList.toggle("active", x===b));
  renderAssets();
});
$("asset-upload").onclick = ()=>{
  state.assets.unshift({id:"a"+Date.now(), kind:"image", name:"上传参考图.jpg", project:"p1"});
  renderAssets(); toast("已上传到本项目库（示意）");
};
$("cv-zoom-in").onclick = ()=>{ state.wf.zoom=Math.min(1.6, state.wf.zoom+0.1); renderWorkflow(); };
$("cv-zoom-out").onclick = ()=>{ state.wf.zoom=Math.max(0.5, state.wf.zoom-0.1); renderWorkflow(); };
$("cv-zoom-reset").onclick = ()=>{ state.wf.zoom=1; renderWorkflow(); };
document.querySelectorAll(".tpl-btn").forEach(b=>b.onclick=()=>{
  loadTpl(b.dataset.tpl); renderWorkflow(); toast("已套用模板到当前项目（示意）");
});
document.querySelectorAll(".palette-btn").forEach(b=>b.onclick=()=>{
  const id="n"+Date.now();
  state.wf.nodes.push({id, type:b.dataset.add, label:kindLabel(b.dataset.add), x:180+state.wf.nodes.length*20, y:240, text:"新建节点"});
  state.wf.selected=id; renderWorkflow(); toast("已添加节点");
});

renderRail();
loadTpl("beauty_linear");
</script>
</body>
</html>
